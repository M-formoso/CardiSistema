[build]
builder = "RAILPACK"
buildCommand = "corepack enable && corepack prepare pnpm@10.22.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @cardi/shared build && pnpm --filter @cardi/backend db:generate && pnpm --filter @cardi/backend build"

[deploy]
startCommand = "pnpm --filter @cardi/backend start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
