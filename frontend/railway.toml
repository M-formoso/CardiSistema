[build]
builder = "RAILPACK"
buildCommand = "corepack enable && corepack prepare pnpm@10.22.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @cardi/shared build && pnpm --filter @cardi/frontend build"

[deploy]
startCommand = "pnpm --filter @cardi/frontend start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
